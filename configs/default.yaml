# Configuration. Values marked [orig] are copied from the original notebooks (Stage number in brackets) and describe what was run.
# Values marked [NEW] did not exist in the original run and are choices made for the revision.
paths:
  base_drive: /content/drive/MyDrive/Thesis-Agung_Prawoto-56225110019          # [orig S1-S4]
  pairs_csv: DPO/dpo_dataset_output.csv                                         # [orig S2] relative to base_drive
  eval_out_dir: OUTPUT_EVAL                                                     # [orig S4] holds evaluation_per_sample_epoch{1,2,3}.csv and precomputed_contexts.json
  adapter_orig: Dataset/qwen2-7b-dpo-lora-adapter                               # [orig S3]
  eval_csv: "<PUBLISHED_SHEET_CSV_URL or a local csv path>"                     # [orig S4] evaluation questions with 'Jawaban (ground truth)'
  run_dir: REVISION_RUN                                                         # [NEW] all revision outputs

data:
  initial_run_n_pairs: 86            # [orig S2 paper] first 86 rows = initial run (175 questions); CHECK with the timestamp report in the notebook

scoring:                              # [orig S2/S4]
  embed_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  weights: {sg: 0.4, sr: 0.4, sl: 0.2}
  margin_threshold: 0.15
  top_k: 3
  max_context_chars_per_source: 1200
  flag_rule: "any of: empty | score<0.50 | relevance<0.35 | (context present and grounding<0.20)"   # S4 hallucination_audit

training:                             # [orig S3]
  base_model: Qwen/Qwen2-7B-Instruct
  lora: {r: 16, alpha: 32, dropout: 0.05, bias: none, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
  dpo:
    beta: 0.1
    learning_rate: 5.0e-5
    lr_scheduler: cosine
    warmup_ratio: 0.1
    epochs: 1
    per_device_batch: 1
    grad_accum: 4                     # effective batch 4 -> 234 pairs = 59 optimizer steps
    optimizer: paged_adamw_8bit
    max_length: 1024                  # prompt + completion; no separate max_prompt_length
  selection:
    n_train: 234                      # [orig LOG] 693 loaded -> 59 optimizer steps (batch 1 x accum 4) -> 234 examples
    mode: length_filter               # [HYPOTHESIS, verify with selection.calibrate] 234 = pairs surviving the max_length=1024 filter, NOT a sample
    max_length: 1024
  seed: 42                            # [NEW] original training set no seed
  arms:
    clean_minimal: {from: orig_subset, language: chosen_or_rejected, dedupe: true}   # [NEW] same subset minus Chinese / repeated-question pairs

evaluation:                           # [orig S4] sampling settings live in prompts/generation_prompts.yaml (stage4_sampling)
  n_runs: 3
  run_seeds: [101, 102, 103]          # [NEW] the original runs were unseeded
  nli: {model: cross-encoder/nli-deberta-v3-small, entail_threshold: 0.50, max_chars: 512}     # [orig S4 Cell 20]
  dahl_atomic: {runs: [3], threshold: 0.50, checker: "base Qwen2-7B-Instruct, greedy"}          # [orig S4 Cell 9B/19] original: Run 3 only; add 1, 2 if quota allows
  judge_responses: {enabled: false, flag_max_factual_support: 2}                                # [NEW] optional

decontamination:                      # [NEW]
  tau: 0.80
  embed_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2

judges:                               # [NEW] label validation; model families different from the generator (Qwen2). Accept licences on Hugging Face first.
  - {name: judgeA, backend: hf, model: google/gemma-2-9b-it, batch_size: 4}
  - {name: judgeB, backend: hf, model: meta-llama/Llama-3.1-8B-Instruct, batch_size: 4}
