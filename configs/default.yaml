# Pre-specified configuration. Every value here is written to outputs/<run>/config_snapshot.json.
# Values marked (proposed) are defaults chosen for a free Colab T4; they are NOT recovered from the original v4 run.
seed: 42
paths: {pairs: data/pairs.csv, eval: data/eval_queries.csv, out: outputs}

scoring:
  embed_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  weights: {sg: 0.4, sr: 0.4, sl: 0.2}
  margin_threshold: 0.15
  flag_threshold: 0.50            # TPS below this = flagged ("TPS flag rate")
  min_keyword_len: 4

training:
  base_model: Qwen/Qwen2-7B-Instruct
  load_in_4bit: true
  lora: {r: 16, alpha: 32, dropout: 0.05, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
  dpo:
    beta: 0.1                     # (proposed)
    learning_rate: 5.0e-5         # (proposed, LoRA)
    lr_scheduler: cosine
    warmup_ratio: 0.1
    epochs: 1
    per_device_batch: 1
    grad_accum: 4                 # effective batch size 4 -> 234 examples = 59 optimizer steps
    max_prompt_length: 1024
    max_length: 1536
    optimizer: paged_adamw_8bit
    gradient_checkpointing: true
    reference: "frozen base model (LoRA adapter disabled)"
  selection: {n_train: 234, mode: random, seeds: [42]}      # add seeds [42, 43, 44] for training variance
  arms: [raw, clean]              # raw: no repairs; clean: language filter (either side) + deduplication
  clean_repairs: {language: chosen_or_rejected, dedupe: true}

decontamination:
  tau: 0.80                       # cosine similarity above which an eval question is treated as overlapping; inspect the report
  embed_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  unit: question                  # separation unit: eval questions vs all 693 pool questions

evaluation:
  n_runs: 3
  run_seeds: [11, 12, 13]
  temperature: 0.7                # (proposed)
  top_p: 0.9
  max_new_tokens: 256

checks:
  nli:
    model: MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7
    entail_threshold: 0.5
    supported_share_min: 0.5
    window_tokens: 300
    stride: 150
  dahl_style: {supported_share_min: 0.5, entail_threshold: 0.5}
  judge_response_flag_max_factual_support: 2

# Two judges from different model families than the generator (Qwen2). Accept the model licences on Hugging Face first.
judges:
  - {name: judgeA, backend: hf, model: google/gemma-2-9b-it, batch_size: 4}
  - {name: judgeB, backend: hf, model: meta-llama/Llama-3.1-8B-Instruct, batch_size: 4}
  # API alternative: {name: judgeC, backend: openai_compat, model: <model>, base_url: https://.../v1, key_env: JUDGE_API_KEY}
